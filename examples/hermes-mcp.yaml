# Merge this block into ~/.hermes/config.yaml in the Hermes container.
# The Hermes container must be attached to the ai_mcp_network Docker network.
mcp_servers:
  exercises:
    url: "http://mcp:8000/mcp"
    timeout: 120
    connect_timeout: 30
    supports_parallel_tool_calls: true
    tools:
      resources: false
      prompts: false
